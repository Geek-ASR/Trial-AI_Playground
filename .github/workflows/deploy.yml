name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so the AI News page stays fresh.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch latest AI news
        run: npm run news
      - run: npm test
      - run: npm run build
      # Pages must be switched on once by a repo admin (Settings → Pages → Source: GitHub Actions).
      # Until then, skip the deploy with a notice instead of failing the run.
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Site built and tested but not deployed. Enable it in Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
